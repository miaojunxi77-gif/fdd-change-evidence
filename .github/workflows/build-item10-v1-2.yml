name: Build Item10 Financing V1.2
on:
  push:
    paths:
      - 'tools/item10_v12/**'
      - '.github/workflows/build-item10-v1-2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade openpyxl
      - name: Build V1.2
        run: python -m tools.item10_v12.main
      - name: Verify artifacts
        run: |
          test -s release/item10-v1.2/Item10_Financing_Advisor_Package_V1_2.xlsx
          test -s release/Item10_Financing_Production_V1_2_Release.zip
          python - <<'PY'
          from openpyxl import load_workbook
          from zipfile import ZipFile
          p='release/item10-v1.2/Item10_Financing_Advisor_Package_V1_2.xlsx'
          w=load_workbook(p,read_only=True,data_only=False)
          assert w['Brand-Year Evidence'].max_row==13240
          assert w['Within-Firm Changes'].max_row==352
          assert w['Unresolved'].max_row==116
          w.close()
          with ZipFile('release/Item10_Financing_Production_V1_2_Release.zip') as z: assert z.testzip() is None
          print('V1.2 artifact verification passed')
          PY
      - name: Commit generated release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/item10-v1.2 release/Item10_Financing_Production_V1_2_Release.zip public/data/item10-financing-v1.2
          git diff --cached --quiet || git commit -m 'Build Item 10 financing Production V1.2 release'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Item10_Financing_Production_V1_2_Release
          path: |
            release/item10-v1.2/Item10_Financing_Advisor_Package_V1_2.xlsx
            release/Item10_Financing_Production_V1_2_Release.zip
