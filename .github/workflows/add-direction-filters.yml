name: Add atomic direction filters

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-direction-filters.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Item drilldown filters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/full-data-components.tsx")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str):
              global text
              if old not in text:
                  raise SystemExit(f"Patch anchor not found:\n{old[:220]}")
              text = text.replace(old, new, 1)

          replace_once(
          '''const atomicChangeLabels: Record<AtomicChangeType, string> = {
            introduced: "新增",
            modified: "修改",
            removed: "删除",
            reclassified: "重新分类",
          };

          function evidencePageRange''',
          '''const atomicChangeLabels: Record<AtomicChangeType, string> = {
            introduced: "新增",
            modified: "修改",
            removed: "删除",
            reclassified: "重新分类",
          };

          type EconomicBurdenFilter = "all" | "increase" | "decrease";
          type ControlShiftFilter = "all" | "toward_franchisor" | "toward_franchisee";

          function atomicMatchesFilters(
            atomic: AtomicChange,
            changeType: "all" | AtomicChangeType,
            economicBurden: EconomicBurdenFilter,
            controlShift: ControlShiftFilter,
          ) {
            return (changeType === "all" || atomic.changeType === changeType)
              && (economicBurden === "all" || atomic.economicBurdenDirection === economicBurden)
              && (controlShift === "all" || atomic.controlShift === controlShift);
          }

          function evidencePageRange''')

          replace_once(
          '''function ComparisonDetail({ row, changeType }: { row: ComparisonRow; changeType: "all" | AtomicChangeType }) {
            const reviewInfo = qualityReviewInfo(row);
            const atomics = (row.atomicChanges ?? []).filter((atomic) => changeType === "all" || atomic.changeType === changeType);''',
          '''function ComparisonDetail({
            row,
            changeType,
            economicBurden,
            controlShift,
          }: {
            row: ComparisonRow;
            changeType: "all" | AtomicChangeType;
            economicBurden: EconomicBurdenFilter;
            controlShift: ControlShiftFilter;
          }) {
            const reviewInfo = qualityReviewInfo(row);
            const atomics = (row.atomicChanges ?? []).filter((atomic) =>
              atomicMatchesFilters(atomic, changeType, economicBurden, controlShift),
            );''')

          replace_once(
          '''  const [outcome, setOutcome] = useState("all");
            const [changeType, setChangeType] = useState<"all" | AtomicChangeType>(initialChangeType);
            const [sort, setSort] = useState("score-desc");''',
          '''  const [outcome, setOutcome] = useState("all");
            const [changeType, setChangeType] = useState<"all" | AtomicChangeType>(initialChangeType);
            const [economicBurden, setEconomicBurden] = useState<EconomicBurdenFilter>("all");
            const [controlShift, setControlShift] = useState<ControlShiftFilter>("all");
            const [sort, setSort] = useState("score-desc");''')

          replace_once(
          '''    .filter((row) => !pairFilter || row.pairId === pairFilter)
            .filter((row) => changeType === "all" || (row.atomicChanges ?? []).some((atomic) => atomic.changeType === changeType))
            .filter((row) => !term''',
          '''    .filter((row) => !pairFilter || row.pairId === pairFilter)
            .filter((row) => {
              const hasAtomicFilter = changeType !== "all" || economicBurden !== "all" || controlShift !== "all";
              return !hasAtomicFilter || (row.atomicChanges ?? []).some((atomic) =>
                atomicMatchesFilters(atomic, changeType, economicBurden, controlShift),
              );
            })
            .filter((row) => !term''')

          replace_once(
          '''  const changeTypeCounts = rows.reduce<Record<AtomicChangeType, number>>((counts, row) => {
            (row.atomicChanges ?? []).forEach((atomic) => { counts[atomic.changeType] += 1; });
            return counts;
          }, { introduced: 0, modified: 0, removed: 0, reclassified: 0 });
            const visibleAtomicCount = visible.reduce((sum, row) => sum + (row.atomicChanges ?? []).filter((atomic) => changeType === "all" || atomic.changeType === changeType).length, 0);''',
          '''  const changeTypeCounts = rows.reduce<Record<AtomicChangeType, number>>((counts, row) => {
            (row.atomicChanges ?? []).forEach((atomic) => { counts[atomic.changeType] += 1; });
            return counts;
          }, { introduced: 0, modified: 0, removed: 0, reclassified: 0 });
            const economicBurdenCounts = rows.reduce((counts, row) => {
              (row.atomicChanges ?? []).forEach((atomic) => {
                if (atomic.economicBurdenDirection === "increase") counts.increase += 1;
                if (atomic.economicBurdenDirection === "decrease") counts.decrease += 1;
              });
              return counts;
            }, { increase: 0, decrease: 0 });
            const controlShiftCounts = rows.reduce((counts, row) => {
              (row.atomicChanges ?? []).forEach((atomic) => {
                if (atomic.controlShift === "toward_franchisor") counts.toward_franchisor += 1;
                if (atomic.controlShift === "toward_franchisee") counts.toward_franchisee += 1;
              });
              return counts;
            }, { toward_franchisor: 0, toward_franchisee: 0 });
            const visibleAtomicCount = visible.reduce((sum, row) => sum + (row.atomicChanges ?? []).filter((atomic) =>
              atomicMatchesFilters(atomic, changeType, economicBurden, controlShift),
            ).length, 0);''')

          replace_once(
          '''        </label>
                  <label className="select-control">
                    <span>排序</span>
                    <select value={sort} onChange={(event) => { setSort(event.target.value); setShown(30); }}>''',
          '''        </label>
                  <label className="select-control">
                    <span>Economic burden</span>
                    <select value={economicBurden} onChange={(event) => { setEconomicBurden(event.target.value as EconomicBurdenFilter); setShown(30); }}>
                      <option value="all">全部方向</option>
                      <option value="increase">Franchisee burden 增加（{economicBurdenCounts.increase.toLocaleString()}）</option>
                      <option value="decrease">Franchisee burden 减少（{economicBurdenCounts.decrease.toLocaleString()}）</option>
                    </select>
                  </label>
                  <label className="select-control">
                    <span>Control shift</span>
                    <select value={controlShift} onChange={(event) => { setControlShift(event.target.value as ControlShiftFilter); setShown(30); }}>
                      <option value="all">全部方向</option>
                      <option value="toward_franchisor">Toward franchisor（{controlShiftCounts.toward_franchisor.toLocaleString()}）</option>
                      <option value="toward_franchisee">Toward franchisee（{controlShiftCounts.toward_franchisee.toLocaleString()}）</option>
                    </select>
                  </label>
                  <label className="select-control">
                    <span>排序</span>
                    <select value={sort} onChange={(event) => { setSort(event.target.value); setShown(30); }}>''')

          replace_once(
          '''      {outcome === "review" ? (
                  <div className="quality-review-filter-note">''',
          '''      {(economicBurden !== "all" || controlShift !== "all") ? (
                  <div className="active-filter-note change-type-active-note">
                    Direction filter active: <strong>{economicBurden !== "all" ? `Economic burden = ${economicBurden}` : ""}{economicBurden !== "all" && controlShift !== "all" ? " · " : ""}{controlShift !== "all" ? `Control shift = ${controlShift}` : ""}</strong>.
                  </div>
                ) : null}

                {outcome === "review" ? (
                  <div className="quality-review-filter-note">''')

          replace_once(
          '''            <ComparisonDetail row={row} changeType={changeType} />''',
          '''            <ComparisonDetail
                          row={row}
                          changeType={changeType}
                          economicBurden={economicBurden}
                          controlShift={controlShift}
                        />''')

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate build
        run: |
          npm ci
          GITHUB_PAGES=true npm run build:github
          node scripts/sanitize-published-site.mjs out

      - name: Commit filter update and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/full-data-components.tsx
          git rm .github/workflows/add-direction-filters.yml
          git commit -m "Add burden and control direction filters"
          git push origin HEAD:main

      - name: Deploy updated Pages site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
